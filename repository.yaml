# 一个商店仓 · 两个加载项（2026-10-06 语音侧并入自 huijian-gateway-plugin-yy）：
#   huijian_mqtt_broker/  慧尖 LoRa 网关   镜像 ghcr.1ms.run（v1.7.x）
#   huijian_voice/        慧尖HA语音插件   镜像阿里云 ACR  （v1.1.x）
# 两者独立镜像、独立版本号、独立发版链（.github/workflows/ci.yaml 与 ci-voice.yaml）。
# 并的是**商店仓**，不是加载项——语音侧 v4.1「不并入 LoRa 网关加载项」定案仍然成立
# （镜像体积/重启爆炸半径/发布节奏/资源隔离/产品边界五理由针对的是"合成一个加载项"）。
#
# ⚠ name 只决定商店卡标题。Supervisor 给加载项编的身份是
#   f"{sha1(用户注册的那个 URL)[:8]}_{config.yaml 里的 slug}"
#   （supervisor/store/utils.py:12-15 + store/data.py:240）⇒ **本仓 URL 定死在 HJKJ，
#   往后也不许再改**：换 URL＝换 hash＝全体已装用户 slug 变＝要求所有人重装，且旧仓
#   在有人装着的时候根本删不掉（store/__init__.py:247-251）。
#   2026-10-06 已经付过一次这个代价：仓自 ha-gateway-plugin 迁到本 HJKJ，网关侧 hash
#   由 386f32f8 变成 c2df40f3，老用户按加载项 README 的迁移公告重装（一次性切换，
#   用户点名裁定）。同一条 hash 机制也是「语音原仓 huijian-gateway-plugin-yy 不能删」
#   的原因之一——它的 Releases 是 huijian_voice/firmware.lock.json 里 30 条固件 URL
#   的运行时宿主，删仓会静默炸 OTA。
