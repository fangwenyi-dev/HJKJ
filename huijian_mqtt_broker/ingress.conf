# 此文件为镜像构建时的默认配置（构建期占位）
# run.sh 启动时会动态重新生成此文件（注入 SUPERVISOR_TOKEN 和端口变量）
# v1.6.12（第五轮审计）：更正"兜底"叙事——容器内唯一启动 nginx 的就是 run.sh，
# 且它启动前必先重写本文件，"run.sh 未执行则此文件兜底"是不成立的死路径
# （即便人工起 nginx，DYNAMIC_TOKEN 占位也使 /api/ha/ 恒 401）。本文件的真实
# 角色是 run.sh heredoc 的第二拷贝（v1.6.3/1.6.9/1.6.10 已三次修漂移）——
# 任何 nginx 指令改动必须与 run.sh heredoc 同步（v1.7.12 起机械门禁实证：
# tests/test_v1712_audit.py 对两拷贝做归一化逐行 diff，漂移即 CI 失败；
# 此前该行是虚言——v1.6.3/1.6.9/1.6.10 三次漂移全靠人工兜底）
server {
    listen 10998;

    # host_network 模式：允许 Supervisor/HA Core (172.30.32.x) 和本地回环
    allow 127.0.0.1;
    allow 172.30.32.0/24;
    deny all;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # v1.6.6：与 run.sh 动态生成版同步——静态页必须 no-store，
        # 防止插件更新后浏览器启发式缓存继续供旧版 index.html
        add_header Cache-Control "no-store" always;
    }

    # 代理 HA Core REST API — token 在 run.sh 启动时注入
    # /api/ha/ → HA Core REST API（设备、服务、实体等）
    location /api/ha/ {
        proxy_pass http://supervisor/core/api/;
        proxy_set_header Authorization "Bearer DYNAMIC_TOKEN";
        proxy_set_header Content-Type "application/json";
        proxy_set_header Accept "application/json";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_ssl_verify off;
        # v1.6.9：与 run.sh 生成版同步 no-store（此前唯一漏网：HA Core 的
        # 设备/实体/条目 JSON 无缓存头会被浏览器启发式缓存 → UI 陈旧）。
        # 本文件是构建期默认 + run.sh 异常时的兜底，两处必须一致，否则
        # 兜底路径仍会供出可缓存响应，且误导按本文件做安全审计的读者
        add_header Cache-Control "no-store" always;
    }

    # v1.6.3：删除 /api/supervisor/ 死代理——Supervisor 禁止插件 API 自更新
    # （恒 403 定案），前端零调用；保留只会把带 Supervisor token 的通道
    # 暴露给同网段其它加载项。与 run.sh 动态生成版保持同步。

    # MQTT Broker 状态检测 — status.json 由 run.sh 后台探活循环每 5 秒刷新，
    # 真实反映 mosquitto 存活（v1.6.3 前为硬编码 return 200，掩盖崩溃状态）
    location = /api/status {
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        try_files /status.json =404;
    }

    # v1.6.6：version.json / integration.json 补 no-store（与 run.sh 同步）
    location /api/version {
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        try_files /version.json =404;
    }

    # 集成安装状态 — 插件本地事实（integration.json 由 run.sh 写入）
    location = /api/integration {
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        try_files /integration.json =404;
    }

    # Broker 客户端连接数 — broker_status.json 由后台循环每 5 秒刷新
    location = /api/broker {
        add_header Cache-Control "no-store" always;
        root /usr/share/nginx/html;
        try_files /broker_status.json =404;
    }

    # 代理 GitHub API（检查更新用），避免 Ingress iframe 中 CSP 拦截外部请求
    # v1.6.6：hide 上游自带 Cache-Control 并统一 no-store（与 run.sh 同步）
    location /api/github/ {
        proxy_pass https://api.github.com/;
        proxy_set_header Host api.github.com;
        proxy_ssl_server_name on;
        # 审计 2026-09-30 F-1：proxy_ssl_verify 默认 off——只开 SNI 不校验证书，
        # 同网段 MITM 可伪造 release JSON 支配面板的"最新发布版"徽章与说明正文。
        # 与 run.sh 生成的那份保持一致（run.sh 会带 CA 束存在性判定重新生成）。
        # verify_depth 2 而非 nginx 默认的 1：gitee 实测链有两层中间 CA（TrustAsia
        # DV CA 2024 → TrustAsia Root，Root 又由 Certum 根交叉签名且服务端不发），
        # 默认深度会判超限 502。CA 束由 Dockerfile 显式列装，缺文件是 [emerg] 级。
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 2;
        proxy_read_timeout 15s;
        proxy_connect_timeout 10s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # 代理 Gitee API（默认更新源，无速率限制）——v1.6.3 补齐与 run.sh 生成版的差异
    location /api/gitee/ {
        proxy_pass https://gitee.com/api/v5/;
        proxy_set_header Host gitee.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 2;
        proxy_read_timeout 15s;
        proxy_connect_timeout 10s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
