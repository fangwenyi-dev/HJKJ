name: 慧尖 LoRa 网关
version: "1.7.62"
slug: huijian_mqtt_broker
description: 慧尖开窗器 LoRa 网关一体化插件，内置 Mosquitto Broker + 网关集成，安装即用
url: 'https://github.com/fangwenyi-dev/ha-gateway-plugin'
arch:
  - amd64
  - aarch64
init: false
startup: system
watchdog: tcp://[HOST]:2022
ingress: true
ingress_port: 10998
panel_icon: mdi:leaf-circle-outline
panel_title: 慧尖网关
# host_network: 容器直接使用主机网络，mosquitto 监听主机 2022 端口
# mDNS (zeroconf) 广播可到达物理 LAN，LoRa 网关通过 huijian.local 自动发现
# Python zeroconf 使用普通 UDP socket 广播，不需要设备级访问权限
# 允许经 nginx 注入 token 走 /core/api/ 代理访问 HA Core REST API（设备、状态、服务等）
# Web UI 的 haApi() 调用依赖此权限，否则返回 401
homeassistant_api: true
# v1.6.3：移除 hassio_api。Web UI 已零调用 Supervisor 管理 API——
# 插件自更新被 Supervisor 安全设计禁止（/addons/self/update 恒 403，实测定案），
# 旧的「一键升级依赖此权限」注释不实；/api/supervisor/ 死代理已随 run.sh 删除。
# 权限最小化：不再需要就声明，降低 token 泄露影响面。
host_network: true
# v1.6.4 定案：启用预构建镜像——安装/升级从"NAS 现场 apk+pip 编译(慢网挂死)"
# 变为"匿名拉 ghcr 几十秒"。CI 每次 push 构建 {arch}-huijian-mqtt-broker:
# {version}+latest，Supervisor 按 config 版本号拉取对应 tag。
# 包 public 化定案（2026-08-29 实验实锤）：GitHub 无 visibility 变更 API
# （REST/GraphQL 全路径实测），但 Actions 用 GITHUB_TOKEN 首推的包【继承
# 仓库可见性】——public 仓库⇒包自动 public。旧包 private 是 8-25 仓库当天
# 本地手工 docker push 创建所致（可见性创建时定死，后续推版本不改）。
# 修复手段即：删包→CI 重建（无需任何人工网页点击）。
# 镜像主源演变史（每次改主源须同步 tests/test_audit_round6.py 的域白名单
# 钉桩——它只钉"域名 ∈ 实测过的候选集"，具体主源以本定案为准）：
# v1.6.16 nju → v1.6.18 1ms → v1.6.19 回退 nju → v1.6.20 回退源站 ghcr.io
# → v1.7.17 定案主源 = 毫秒镜像 ghcr.1ms.run（推翻 v1.6.20）。
#   起因：2026-09-06 现网安装失败实锤——Supervisor 直连 ghcr.io 拉
#   1.7.16 blob 传输中途 "read tcp [2606:50c0:8000::154]:443: connection
#   reset by peer"（IPv6 走 GitHub 海外 CDN 被干扰），v1.6.20 时代
#   "源站 216KB/s 稳定"的实测环境已不复存在；同日 1ms 实测 manifest +
#   blob 匿名可拉（热缓存 ~1.1MB/s+）。镜像本体仍单份推 ghcr.io 源站
#   （CI 构建推送与源站匿名拉取门不变），1ms 为 pull-through 透传按需回源。
#   已知残余风险（v1.6.19 翻车复盘，勿忘）：1ms 多边缘 LB 对【刚发布的
#   新 tag】冷缓存边缘可能短暂 200/404 闪断、分钟~小时级自愈，CI
#   warm-mirrors 发版后即预热但只覆盖部分边缘——发版后 1 小时内首装
#   报"拉取失败"重试一次即恢复；nju 已缓存层最快但新 tag 大层回源可能
#   "假活慢滴"（实测 311B/s 递减），仅作次选手动备源。
#   长期最优解（待用户决策）：自建阿里云 ACR 个人版推镜像（国内确定性
#   全速、无第三方边缘问题），CI 加 login step 即可整体切换。
# 手动换源自救（Supervisor 无多源故障转移）：加载项详情页
# 「配置 → 高级 → 镜像(Image)」覆盖域名（路径不变），备选
# ghcr.nju.edu.cn → ghcr.io(需自备网络加速)；商店元数据有缓存，
# 换源/升级前先在商店 ⋮→检查更新刷新。
image: ghcr.1ms.run/fangwenyi-dev/{arch}-huijian-mqtt-broker
# v1.6.12（第五轮审计）：移除 ssl 挂载——全仓（run.sh/Dockerfile/mosquitto.conf/
# 集成/Web）对 /ssl 零引用，broker 也未启用 TLS；与 v1.6.3 移除 hassio_api 时
# 自立的"权限最小化：不需要就不声明"准则对齐（保留的 homeassistant_config:rw
# 为持久化数据与集成回链真实依赖，非死映射）
map:
  - homeassistant_config:rw
options:
  username: huijian
  password: huijian2022
  auto_setup_ha_mqtt: true
  install_integration: true
  # v1.6.26（D-3）：共存桥总开关。判据是"本机 :1883 有进程 LISTEN"即向对端
  # 搭方向分离桥（v1.6.24 零配置语义）。谨慎用户或宿主上跑有第三方 1883
  # 服务时置 false 熔断：不建新桥、已建桥自动拆除。
  # v1.7.13 用户定案（2026-09-08）：**默认改关**。零配置共存语义在官方
  # Mosquitto 7.x 强制认证下退化为"匿名桥 30s 被拒一次"的对端日志风暴
  # （慧尖自身无恙，但纯慧尖用户被平白噪音化）；需要 z2m 共存时在加载项
  # 配置页重新打开本开关并按下项填官方 broker 有效凭据即可，能力零损失。
  coexist_bridge_enabled: false
  # v1.6.24 引入（未单独发布，随 v1.6.25 首发——此前注释被版本 bump 的
  # 全局 sed 漂成过"v1.6.25"，v1.6.26 订正归属）：官方「Mosquitto broker」
  # 加载项 7.x+ 强制认证时须填其任一有效账号（配置页 logins 添加的），
  # 桥才连得上；留空=匿名桥，兼容老版官方或 customize 关认证场景。
  # ⚠️ 两字段必须成对填写——v1.6.26（D-2）起半填形态按匿名桥降级
  # （旧版会写出 `password ` 空值行导致 mosquitto 整份 conf 拒载）。
  # 纯慧尖用户永远无需理会本项。
  coexist_official_user: ""
  coexist_official_password: ""
  # v1.7.19（方案一：普适共存）：共存桥【追加】主题树。HA 的 MQTT 集成全局
  # 唯一且必须钉在慧尖内置 broker（网关主题不可跨桥），官方 broker 上其他
  # MQTT 生态（ESPHome/Tasmota/Shelly/自研前缀…）与 HA 互通的唯一通道就是
  # 这座桥——旧桥只接 z2m 两棵树，其他加载项"能发现、控不了"。本项在默认腿
  # （zigbee2mqtt/# 双向 + homeassistant/# 进）之上追加分隔条目：
  #   pattern[:direction] 逗号分隔；direction 取 in|out|both，缺省 both；
  #   in=官方→慧尖（设备状态/上报进 HA），out=慧尖→官方（HA 命令送达设备）。
  # 例：完整接管 ESPHome 生态填 "esphome/#"；Tasmota 按腿填
  #   "tele/#:in, stat/#:in, cmnd/#:out"。改后重启慧尖生效。
  # 红线（代码级不可配解）：gateway/test/$SYS 保留树、通配首层、全匹配 #
  # 一律拒绝；homeassistant 树重复请求忽略（out 腿永久钳制防心跳回灌）。
  coexist_bridge_topics: ""
  # v1.7.11 快速自动发现：容器内代理订阅 gateway/rpt_rsp，捕获网关上报即
  # 经 Supervisor API 代发起发现流程——全新 HA（从未添加过集成）也能秒级在
  # 「设置→设备与服务」出现"慧尖网关"发现卡片（此前必须先手动添加一次
  # 集成才会有耳朵听上报）。置 false 回退传统发现路径。用户确认权不变：
  # 卡片仍需本人点击配对。代理唯一会自动创建的是零功能「等待条目」（无 SN、
  # 不建实体，仅给 HA 装耳朵接收上报，v1.7.11 定案）；真实网关卡片仍须本人确认。
  fast_auto_discovery: true
schema:
  # v1.7.16 商店回归修复（根因实证：home-assistant/supervisor
  # apps/options.py::RE_SCHEMA_ELEMENT——schema 类型只接受
  # type / type(min,max) / 尾缀 ?，2024.01→2026.09 全部版本均无
  # `=默认值` 语法。v1.7.12 写的 `str=huijian`/`password=huijian2022`
  # 使 config.yaml 在商店刷新时整份校验失败（store/data.py 记
  # "Can't read" 后静默跳过），加载项从商店整体消失——新装用户
  # "找不到慧尖 LoRa 网关"即此。钉桩 tests/test_v1716_store_schema.py。）
  # 新装默认值本就由上方 options: 块供给（Supervisor 唯一正规途径），
  # run.sh 启动时把任何偏离内置凭据的配置自动恢复默认（见"凭据自动恢复"）
  # ——删掉 `=` 不损失任何行为。
  # v1.7.12 凭据定案：LoRa 网关固件内置 huijian/huijian2022/端口2022，用户无需
  # 也不应修改——改了只会把自家网关挡在 broker 门外。
  username: str
  # password 类型：Supervisor 配置页输入框脱敏显示（str 会明文回显在设置页）。
  # 注意 Supervisor 会对已保存值做脱敏存储，UI 显示 * 属正常
  password: password
  auto_setup_ha_mqtt: bool
  install_integration: bool
  coexist_bridge_enabled: bool
  coexist_official_user: str?
  coexist_official_password: password?
  coexist_bridge_topics: str?
  fast_auto_discovery: bool
