# 慧尖加载项 Supervisor 配置表单本地化（官方机制：supervisor
# store/data.py::_read_addon_translations 读本目录，schema：
# configuration.<键>: name(必填)/description ——2025.12 源码实证）。
# 前端按浏览器语言取 <语言代码>.yaml；zh-CN.yaml 为本文件同文兜底。
configuration:
  username:
    name: MQTT 用户名（建议勿改）
    description: >-
      LoRa 网关固件内置值 huijian。改动会在启动时被自动恢复默认——
      改了只会把自家网关挡在 broker 门外，用户无需配置。
  password:
    name: MQTT 密码（建议勿改）
    description: >-
      固件内置值 huijian2022。改动会被自动恢复，用户无需配置。
  auto_setup_ha_mqtt:
    name: 自动配置 HA 的 MQTT 集成
    description: >-
      自动把 HA「MQTT 集成」指向内置 broker（127.0.0.1:2022）。
      建议保持开启；关闭后慧尖网关将失联。
  install_integration:
    name: 自动安装/更新慧尖集成
    description: >-
      自动把集成代码落盘到 HA（升级加载项后重启即更新到新版）。
      建议保持开启。
  coexist_bridge_enabled:
    name: MQTT 共存桥（默认关闭）
    description: >-
      开启后探测本机 1883 端口，发现官方「Mosquitto broker」加载项即自动
      搭消息桥共存（默认接 zigbee2mqtt 双向 + HA 发现主题进）。ESPHome、
      Tasmota 等其他 MQTT 加载项经下方「共存桥 · 追加桥接主题」打通后即可
      在官方 broker 上全功能使用。官方 7.x 起强制认证，须同时成对填写
      下方两项官方账号凭据，否则桥连不上（仅官方侧日志每 30 秒出现一条
      拒绝记录，慧尖自身功能不受影响）。只用慧尖网关请保持关闭。
  coexist_official_user:
    name: 共存桥 · 官方 broker 用户名
    description: >-
      填官方 Mosquitto 加载项自己「配置」页添加的账号。
      不要填 huijian——官方用户库里没有它。须与密码成对填写。
  coexist_official_password:
    name: 共存桥 · 官方 broker 密码
    description: >-
      上述官方账号的密码。只填一半会按匿名桥降级并打警告。
  coexist_bridge_topics:
    name: 共存桥 · 追加桥接主题
    description: >-
      默认桥只接 zigbee2mqtt/#（双向）与 homeassistant/#（进）。要让
      ESPHome、Tasmota 等加载项经官方 broker 全功能共存，在此追加它们
      的主题树：逗号分隔「主题[:方向]」，方向取 in（设备→HA）/out
      （HA→设备）/both（双向，缺省）。示例：esphome/# 或
      tele/#:in, stat/#:in, cmnd/#:out。改后重启慧尖生效。gateway、test
      等保留树与全匹配模式代码级拒绝——开窗器指令面永不跨桥（安全红线）。
  fast_auto_discovery:
    name: 网关快速自动发现
    description: >-
      网关上报即在「设备与服务」弹发现卡片，您在卡片上点确认完成添加
      （v1.7.62 起首台也需确认，不再静默自动添加）。建议保持开启；
      关闭后需在「集成」页手动添加。
