name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_republish:
        description: '明知故犯地重发已存在的版本号 tag（覆盖已发布镜像与 Release）；不勾则 prepare 的发布闸会跳过本轮'
        type: boolean
        default: false

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: huijian-mqtt-broker

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ========== 0. 代码质量检查 ==========
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # 审计 2026-09-30 F-4：本 job 此前没有 timeout-minutes（同文件 e2e job 有），
    # 任一用例挂死就等 Actions 默认的 **6 小时**——而"异步挂死＝静默 exit 0"
    # 这类失效在本仓踩过多次，看门狗必须存在。
    # 为什么**不**加 pytest-timeout 的 --timeout：跨仓契约钉里
    # test_v1747_cross_repo_contract._run 用的是 subprocess(timeout=300)，
    # 任何小于它的 per-test 上限都会把"对端仓可见、真在跑"的正常路径判红
    # （假红比无看门狗更糟）。job 级 25 分钟足以兜住挂死，且不改变任何用例语义。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          # 检查所有 shell 脚本语法是否正确
          # v1.7.12（第 6 轮审计 I-2）：范围从"仅 run.sh"扩到全部 shell——
          # e2e 脚本是发布硬门禁的执行体，其语法错误过去只能在 CI 跑 e2e
          # job 时才暴露（且报错形态是运行期怪象而非语法行号），提前拦截
          apt-get update -qq && apt-get install -y -qq shellcheck > /dev/null 2>&1 || true
          for f in huijian_mqtt_broker/run.sh huijian_mqtt_broker/tests/e2e/*.sh; do
            echo "检查 $f ..."
            bash -n "$f" || exit 1
            shellcheck "$f" || echo "⚠ shellcheck 警告（非阻塞）"
          done

      - name: Check YAML files syntax
        run: |
          pip install -q pyyaml
          python3 -c '
          import yaml, sys, glob, os
          # 2026-10-08 审计 B-8：Python glob 的 `*` 不匹配以点开头的目录，旧写法
          # **从未**校验过本仓自己的 workflow（本机实证：12 个文件、0 个来自 .github）。
          # 显式补点目录一路，再加反向自校验——门一旦重新变窄必须当场响亮失败，
          # 不许再用"12 个 ✅ 全绿"给人假安全感（下方 JSON 门走 find，本就覆盖 .github）。
          # 分隔符先归一：glob 在 Windows 上混返 os.sep 与模式里的 /，直接比字符串
          # 会让这道自校验在开发机上假红（本机实测踩到）。
          def norm(p):
              return p.replace(os.sep, "/")
          files = sorted({norm(p) for pat in ("**/*.yaml", ".github/**/*.yaml")
                          for p in glob.glob(pat, recursive=True)})
          claimed = sorted(norm(p) for p in glob.glob(".github/workflows/*.yaml"))
          missing = [f for f in claimed if f not in files]
          if missing:
              print("❌ YAML 门自身漏校验: " + ", ".join(missing))
              sys.exit(1)
          for f in files:
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
                  print(f"✅ {f}")
              except Exception as e:
                  print(f"❌ {f}: {e}")
                  sys.exit(1)
          '

      - name: Check JSON files syntax
        run: |
          for f in $(find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*"); do
            python3 -c "import json; json.load(open('$f'))" || exit 1
            echo "✅ $f"
          done

      - name: Clone peer repos when read-only deploy keys are configured
        id: peer-sync
        # 私有仓在公共 runner 里默认不可见 ⇒ 契约钉只能跳过。给了只读 deploy key 就真跑，
        # 没给就把"没跑"交给下一步的 ::warning:: 说出去（不假装绿）。
        env:
          HUB_REPO_DEPLOY_KEY: ${{ secrets.HUB_REPO_DEPLOY_KEY }}
          MINIPROGRAM_REPO_DEPLOY_KEY: ${{ secrets.MINIPROGRAM_REPO_DEPLOY_KEY }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/peers"
          for pair in "HUB_REPO_DEPLOY_KEY:huijian-cloud-hub" \
                      "MINIPROGRAM_REPO_DEPLOY_KEY:xiaochengxu-mqtt"; do
            var="${pair%%:*}"; name="${pair##*:}"
            key="${!var:-}"
            [ -z "$key" ] && { echo "::notice title=对端仓未配置::$name 无只读 deploy key，契约钉将走「响亮跳过」分支"; continue; }
            printf '%s\n' "$key" > "$RUNNER_TEMP/$name.key"
            chmod 600 "$RUNNER_TEMP/$name.key"
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/$name.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git clone --depth 1 "git@github.com:fangwenyi-dev/$name.git" "$RUNNER_TEMP/peers/$name" \
              || { echo "::warning title=对端仓 clone 失败::$name 拉不下来，契约钉按不可见处理"; continue; }
            case "$name" in
              huijian-cloud-hub) echo "hub=$RUNNER_TEMP/peers/$name" >> "$GITHUB_OUTPUT" ;;
              xiaochengxu-mqtt)  echo "mp=$RUNNER_TEMP/peers/$name"  >> "$GITHUB_OUTPUT" ;;
            esac
          done

      - name: Python syntax & unit tests (v1.6.3 回归护栏)
        # 审计 2026-09-30 H-4 复核：本步也注入对端仓路径——test_v1747 的跨仓
        # 契约钉此前在 CI 必然 skip（"本地全跑、CI 一条不跑"）。配套把
        # peer-sync 前移到本步之前（否则 steps.peer-sync.outputs.* 恒为空）。
        # 没配 deploy key 时两个值为空 ⇒ 与原行为一致（由入口脚本响亮跳过）。
        env:
          HUB_REPO: ${{ steps.peer-sync.outputs.hub }}
          MINIPROGRAM_REPO: ${{ steps.peer-sync.outputs.mp }}
        run: |
          # 38 个既有单测 + 注册表实参回归测试曾在本地全绿却漏掉 v1.6.0 的
          # "entity" 字面量回归——CI 从未跑过 pytest，本地验证形同虚设。补齐。
          # 依赖说明：services.py 真实 import voluptuous（conftest 只假造
          # homeassistant 包树）；@pytest.mark.asyncio 需要 pytest-asyncio，
          # 缺失时 pytest 会把 async 测试直接判 error。
          # v1.6.15 起再加 aiohttp：ws_gateway.py 模块级 from aiohttp import
          # （生产 HA 环境自带，CI 最小环境不带）——缺它 test_ws_gateway 收集
          # 期 ImportError，整个 lint 炸掉（首推 CI 实锤）。
          # v1.7.38：再加 qrcode——面板二维码编码器（www/js/qr.js）的正确性
          # 靠"与独立实现逐格对账"，test_v1738_qr.py 模块级 import qrcode，
          # 缺它收集期就红（不允许静默跳过，那等于没有这条门）。
          pip install -q pytest pytest-asyncio voluptuous aiohttp qrcode
          # zxing-cpp/pillow 只用于"真解码回读"那一条（矩阵对账之外的独立解码器），
          # 装不上不影响其它用例——测试里显式 skip 并写明原因。
          pip install -q zxing-cpp pillow || true
          # v1.6.26（第八轮审计 A-2）：py_compile `*.py` glob 只匹配顶层——
          # v1.6.25 mqtt_handler 拆包后整个子包（~1900 行核心）脱离语法门
          # 覆盖。改 compileall 递归编译，永不复现"目录变子包→门静默缩窄"。
          python3 -m compileall -q huijian_mqtt_broker/custom_components/window_controller_gateway
          python3 -m py_compile huijian_mqtt_broker/mdns_publisher.py
          # v1.7.33（全量审计）：补机械化 lint 门。此前 CI 只有语法+测试，
          # 未用导入/未用变量/裸 except/异常链缺失等一律无人拦（审计实测生产
          # 侧 5 处 F401 + 1 处 B904，测试侧 11 处）。存量已清零，本门零成本。
          pip install -q ruff
          ruff check --select F,E9,B --ignore B008,B905               huijian_mqtt_broker/custom_components               huijian_mqtt_broker/tests               huijian_mqtt_broker/mdns_publisher.py               huijian_mqtt_broker/gateway_discovery_proxy.py
          python3 -m pytest huijian_mqtt_broker/tests -q

      - name: Cross-repo contract pins (跳过必须响亮，可见就真跑)
        # 这三仓有 110 条「两边各写一份」的契约，编译器与单测都抓不到。v1.7.52 之前它们
        # 在 CI 里从没跑过：脚本 exit 3、pytest 记 skipped、job 照绿，于是"CI 9/9 success"
        # 把"没跑"说成了"跑过并通过"。本步把两种形态彻底分开：
        #   · 两个只读 deploy key 都配了 ⇒ clone 对端仓后**真跑**，并自己复核 PASS 计数
        #     ≥ 下限（子脚本被改瘪也要红）；
        #   · 没配 ⇒ 退出 0（跳过不该阻断发版）但打 ::warning:: + 写进 step summary。
        # 两条分支的行为由 tests/test_v1753_ci_contract_pins.py 真跑钉住。
        # 这里**故意不写** continue-on-error——它本就是 false，而 tests/test_audit_round8.py
        # 有一条"全文件只允许 warm-mirrors 出现一次 continue-on-error"的硬门钉；
        # 写冗余的 false 会把那条钉判红。
        env:
          HUB_REPO: ${{ steps.peer-sync.outputs.hub }}
          MINIPROGRAM_REPO: ${{ steps.peer-sync.outputs.mp }}
        run: bash huijian_mqtt_broker/tests/e2e/ci_contract_pins.sh


      - name: Hub lifecycle real-stack e2e (跳过必须响亮，可见就真跑)
        # 审计 2026-09-30 H-4 复核：hub_lifecycle_e2e.sh 此前无任何 CI step
        # 调用——tests/test_v1742_hub_identity.py 守护的 35 条真栈断言
        # （v1.7.41 抹盘自愈事故链）"本地全跑、CI 一条不跑"。入口脚本把
        # "对端仓不可见"与"真跑失败"分成两条分支（同 ci_contract_pins.sh：
        # 不可见 ⇒ ::warning + exit 0；可见 ⇒ 真跑 + PASS 计数下限自检）。
        env:
          HUB_REPO: ${{ steps.peer-sync.outputs.hub }}
        run: bash huijian_mqtt_broker/tests/e2e/ci_hub_lifecycle.sh

      - name: JS syntax gate
        run: |
          # v1.7.33（全量审计）：79KB 手写前端此前无机械语法门——一个花括号
          # 不配对可直发 Release 且浏览器整页白屏（仓库唯一前端结构检查只是
          # onclick↔函数名对账）。node 在 ubuntu-latest 预装。
          for f in huijian_mqtt_broker/www/js/*.js; do node --check "$f"; done

      - name: Verify version consistency
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          # v1.7.12（第 6 轮审计 I-1）：VERSION 提取失败必须即时失败——旧版
          # 若 config.yaml 行格式漂移（如引号变化），VERSION 为空串，
          # 与同样提取失败的 HTML_VER 空串相等"版本一致"假绿过关，
          # 下游 build/release 全拿空版本号
          if [ -z "$VERSION" ]; then
            echo "::error title=config.yaml 版本提取失败::'^version:' 行格式漂移？"
            exit 1
          fi
          echo "config.yaml 版本: $VERSION"
          # 检查 index.html 版本一致
          HTML_VER=$(grep "CURRENT_VERSION = '" huijian_mqtt_broker/www/index.html | sed "s/.*CURRENT_VERSION = '\([^']*\)'.*/\1/")
          echo "index.html 版本: $HTML_VER"
          [ "$VERSION" = "$HTML_VER" ] || { echo "❌ 版本不一致"; exit 1; }
          # 检查 version.json 两个字段一致（addon_version 与 integration_version
          # 此前只查前者，manifest.json 完全没查——四处版本一致是 CLAUDE.md 铁律）
          python3 - "$VERSION" <<'PYEOF'
          import json, sys
          want = sys.argv[1]
          vj = json.load(open('huijian_mqtt_broker/www/version.json'))
          mf = json.load(open('huijian_mqtt_broker/custom_components/window_controller_gateway/manifest.json'))
          for label, got in [("version.json.addon_version", vj.get("addon_version")),
                             ("version.json.integration_version", vj.get("integration_version")),
                             ("manifest.json.version", mf.get("version"))]:
              status = "✅" if got == want else "❌"
              print(f"{status} {label}: {got}")
              if got != want:
                  sys.exit(1)
          PYEOF
          echo "✅ 所有版本号一致: $VERSION"

  # ========== 1. 读取版本号 & 准备变更日志 ==========
  prepare:
    name: Prepare
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        # v1.7.12（审计 I-3）：changelog 兜底路径要 `git log --oneline -10`，
        # 默认 fetch-depth=1 只能给出 1 条——给 20 条历史
        with:
          fetch-depth: 20

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' huijian_mqtt_broker/config.yaml | head -1 | awk -F'"' '{print $2}')
          # v1.7.12（第 6 轮审计 I-1）：空版本 fail-fast——prepare 是 build/
          # manifest/release 三个下游的版本真源，空串会让镜像 tag 成
          # `:latest`+`:`、Release 名成 "v"，污染仓库不可逆
          if [ -z "$VERSION" ]; then
            echo "::error title=config.yaml 版本提取失败::'^version:' 行缺失或格式漂移"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到版本号: $VERSION"

      - name: 发布闸口——本版本号已发布过且非本次提交即跳过
        id: gate
        # 为什么要有这道闸（2026-10-06 迁仓后实测到的副作用）：本仓一条 main 被两个
        # 加载项共用，而本 workflow 的触发是 `push: branches:[main]` 无 paths 过滤 ⇒
        # 语音侧每推一次，网关链就跟着重跑一轮。没有闸时它会**把已发布的版本号原地
        # 重新 build 并覆盖 ghcr**：实测 v1.8.1 的 index digest 从 09432e77d014… 变成
        # 3a4b8de90a91…，而版本号没变 ⇒ 已装用户永远收不到"有更新"，却在自己下次
        # 重装时拿到另一份字节。这就是"重推了但没人需要它"。
        # 判据分三档（与语音侧 ci-voice.yaml 同形，但**语义是跳过不是拦停**）：
        #   tag 不存在            → 这是一次真发版，放行；
        #   tag 指向本次 commit    → 只是重跑失败的构建，放行；
        #   tag 指向别的 commit    → 本次 push 不是网关发版（多半是对端推的），
        #                            **响亮跳过**：::warning:: + publish=false，
        #                            下游 build/e2e/manifest/warm/release/gitee 全 skip。
        # 为什么不像语音侧那样 exit 1：那边"版本号没涨就推 main"是人在犯错，红是应该的；
        # 这边是**对端正常发版顺带触发**，每推一次红一次会把红变成噪音，反而没人看红。
        # 真要覆盖已发布版本：workflow_dispatch 勾 force_republish。
        # ls-remote 必须 `|| true` 且无输出时**降级放行**——闸口不得比它守的事更脆
        # （临时网络/鉴权抖动若把闸打死，正常发版也发不出去）。
        run: |
          set -u
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          REFS=$(git ls-remote origin 2>/dev/null || true)
          if [ -z "$REFS" ]; then
            echo "::warning title=发布闸降级::git ls-remote origin 无输出，本轮跳过存在性判定（按放行处理）"
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          DIRECT=$(awk -v r="refs/tags/$TAG" '$2==r{print $1}' <<<"$REFS")
          # 附注标签的 refs/tags/vX 指向 tag 对象而非 commit，必须一起看 peeled 的 ^{}
          # ——否则同一 commit 的重跑会被误判成"指向他处"而漏发。
          PEELED=$(awk -v r="refs/tags/$TAG^{}" '$2==r{print $1}' <<<"$REFS")
          TARGET="${PEELED:-$DIRECT}"
          if [ -z "$TARGET" ]; then
            echo "tag $TAG 未发布过 → 本轮是真发版，放行"
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "已存在 tag $TAG -> ${TARGET:0:8}"
          if [ "$TARGET" = "${{ github.sha }}" ]; then
            echo "::notice title=重跑同一 commit::$TAG 指向本次提交，按重跑放行"
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ inputs.force_republish }}" = "true" ]; then
            echo "::warning title=强制重发::正在覆盖已发布的 $TAG（原指向 ${TARGET:0:8}）"
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "::warning title=本轮跳过网关发布::$TAG 已发布且指向 ${TARGET:0:8}，本次提交 ${{ github.sha }} 未涨网关版本号（多半是语音侧的 push 触发了本链）。要发网关请先升 huijian_mqtt_broker/config.yaml 的 version；确属故意覆盖则用 workflow_dispatch 勾 force_republish。"
          echo "publish=false" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # 将 changelog 写入临时文件，避免 echo -e 破坏中文编码（Gitee 乱码根因）
          CHANGELOG_FILE="/tmp/changelog.md"
          
          if [ -f CHANGELOG.md ]; then
            awk -v ver="${{ steps.version.outputs.version }}" '
              # 两条版本号线共用本文件（10-06 起），本链只认语音横幅**之前**的网关区。
              # 没这道横幅门时它按 ver 全文匹配：`## [1.2.6]` 在文件里有两处（网关区
              # L2993 / 语音区 L3229），今日靠"网关段在上"侥幸取对；而 ver=1.1.37 这类
              # 网关没有、语音有的号会**静默**把语音那篇当网关 Release 正文发出去
              # （10-08 用 Python 复刻两条链实测）。语音侧链早有横幅门，这次补齐。
              /^# 慧尖HA语音插件 变更日志/{ if (found) exit; done=1; next }
              !done && /^## \[/{ found=0 }
              !done && $0 ~ "^## \\["ver"]" { found=1; print; next }   # v1.6.26（E-3）：命中行要输出——旧 next 吞掉 "## [x.y.z]" 标题，Release 正文裸开头
              !done && /^## \[/{ if(found) exit }
              !done && found { print }
            ' CHANGELOG.md | head -50 > "$CHANGELOG_FILE"
          fi
          
          if [ ! -s "$CHANGELOG_FILE" ]; then
            # 从 git log 自动生成 changelog（最近 10 条提交）
            {
              echo "## v${{ steps.version.outputs.version }}"
              echo ""
              git log --oneline -10 --format='- %h: %s'
            } > "$CHANGELOG_FILE"
          fi
          
          # 用文件内容设置输出（避免 echo -e 破坏 UTF-8 中文）
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          cat "$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

  # ========== 2. 构建 Docker 镜像 ==========
  init:
    name: Init
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, init]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "huijian_mqtt_broker"
          # 迁仓到 HJKJ 后 ghcr 三个包仍【绑在旧仓】（账号下、linked repo=ha-gateway-plugin），
          # HJKJ 的 GITHUB_TOKEN 推不动：denied: permission_denied: write_package。
          # 首选 GHCR_PAT（账号级 write:packages，与包绑哪个仓无关）；没配该 secret 时
          # 回落 GITHUB_TOKEN ⇒ 将来在旧包上给 HJKJ 授了 Write，删掉 GHCR_PAT 链路自动
          # 回到零长期令牌形态，不必改本文件。
          # ⚠ 用 PAT 推【新建】包不会继承仓库可见性（会建成 private）；本仓安全的前提是
          #   三个包已存在且 public（2026-10-06 实测 `gh api user/packages` 三条 visibility=public）。
          container-registry-password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Manifest
    # e2e 为 v1.6.23 起的硬门禁（详见 e2e job 注释）
    needs: [prepare, init, build, e2e]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          # 同 build：多架构索引包 huijian-mqtt-broker 也绑在旧仓，PAT 优先、回落 GITHUB_TOKEN
          container-registry-password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest

      # v1.6.4 定案（实验实锤）：GitHub【没有】visibility 变更 API——
      # REST PUT/PATCH × /user/ 与 /users/{owner}/ 全 404、GraphQL 公开
      # schema 无该 mutation（updateV3RegistryPackage 已被移除）。
      # 但 Actions 用 GITHUB_TOKEN 首推的包【继承仓库可见性】：public 仓库
      # ⇒ 新包自动 public（amd64 删包重建实测 anon 200）。历史包因创建时
      # 走了本地 PAT 推送被永久定死 private，修复手段=删包+重推：
      #   gh api -X DELETE /user/packages/container/<pkg>
      # 探测注意：token 必须带 service=ghcr.io 且 manifest GET 要带
      # OCI/idx Accept 头，否则 audience 错 token 会得到误导性 404。
      - name: Check package visibility
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -u
          check_pull() {
            FAILED=""
            for p in "${IMAGE_NAME}" "amd64-${IMAGE_NAME}" "aarch64-${IMAGE_NAME}"; do
              T=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY_OWNER}/$p:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' || true)
              C=$(curl -s -o /dev/null -w "%{http_code}" \
                   -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                   "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/$p/manifests/${VERSION:-latest}" \
                   -H "Authorization: Bearer ${T:-none}" || echo 000)
              if [ "$C" = "200" ]; then
                echo "✅ ${p} 匿名可拉（public）"
              else
                FAILED="${FAILED} ${p}(HTTP $C)"
              fi
            done
          }
          check_pull
          if [ -n "${FAILED}" ]; then
            # v1.6.9：复测一次再定罪——排除 ghcr 传播延迟/瞬时网络导致的误报
            echo "⏳ 首轮失败，15 秒后复测：${FAILED}"
            sleep 15
            check_pull
          fi
          if [ -n "${FAILED}" ]; then
            # v1.6.9（外部审计确认）：由 ::warning 升级为阻断——config.yaml 已启用
            # image: 路由，包不可匿名拉取时用户安装必失败，绿 CI 是掩盖故障
            echo "::error title=ghcr 包不可匿名拉取::${FAILED} —— image 路线安装会失败。修复：gh api -X DELETE /user/packages/container/<pkg> 删包后重推 CI 自动按仓库 public 重建（详见本文件上方注释）"
            exit 1
          fi


  # ========== 2.5 国内镜像站缓存预热（v1.6.18）==========
  # Supervisor 的 image 只支持单一 URL、无多源故障转移，客户安装快慢取决于
  # config.yaml 所指透传站的缓存冷热（冷缓存=现场回源 ghcr.io，慢且偶发 404）。
  # 发版后立即用本作业把新版本双架构全部 blobs 经各镜像站完整拉一遍，强制
  # 边缘缓存回源命中——首装客户直接命中热缓存。best-effort：continue-on-error
  # 镜像站抖动不阻塞 Release（ghcr 源站才是唯一真身，预热只优化体验）。
  # 注：latest tag 与本版本 tag 指向同一批 blobs，预热版本 tag 即覆盖。
  warm-mirrors:
    name: Warm CN mirrors
    needs: [prepare, manifest]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Pre-pull all blobs via ghcr.1ms.run & ghcr.nju.edu.cn
        run: |
          set -u
          IDX_ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json"
          MAN_ACCEPT="application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
          token_of() { # $1=repo $2=realm(空=匿名) $3=service
            [ -z "$2" ] && return 0
            curl -fsS -m 15 "$2?service=$3&scope=repository:${OWNER}/$1:pull" \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("token") or d.get("access_token",""))' || true
          }
          # v1.6.19（第六轮审计 C′）四处纠偏：
          # ① OCI platform.architecture 值是 "arm64" 而非 "aarch64"——旧过滤
          #   永不命中，全部落到 ms[0]（可能取到 attestation blob 摘要）。
          #   现显式映射且无匹配时报错跳过，绝不瞎猜。
          # ② MAN/BLOBS 的 curl 无兜底：整个函数被 `warm_via || echo` 调用时
          #   set -e 失效，404 → MAN 空 → BLOBS 空 → 循环不执行 → "ok=0
          #   fail=0" 假绿零预热（v1.6.18 首发即此形态）。现逐段判空计入 FAIL。
          # ③ OK/FAIL/BYTES 改按 arch 归零，日志不再跨 arch 累计失真。
          # ④ 1ms 对冷 tag 是多边缘 200/404 闪断（分钟~小时自愈），3×20s 密集
          #   重试无用且易自触发限流（记忆定案：预热低频单轮）→ 改单轮 +
          #   调用方 300s 长间隔一次性复查；nju 慢站超时放宽到 180s。
          warm_via() { # $1=reg $2=realm $3=service $4=timeout秒；返回码=是否全绿
            local REG="$1" REALM="$2" SVC="$3" TMO="${4:-60}"
            local TOTOK=0 TOFAIL=0
            for ARCH in amd64 aarch64; do
              local OCI_ARCH; OCI_ARCH=$([ "$ARCH" = aarch64 ] && echo arm64 || echo "$ARCH")
              # v1.6.26（E-10）：仓名由 workflow env IMAGE_NAME 派生（与 build
              # 推送源同一真源）——旧硬编码在 config.yaml image 改名后会让
              # 预热静默打向不存在的仓库名（全程 404 也"尽力而为"地绿）
              local REPO="${ARCH}-${IMAGE_NAME}" TOK
              TOK=$(token_of "$REPO" "$REALM" "$SVC")
              local -a HDRS=()
              [ -n "$TOK" ] && HDRS+=(-H "Authorization: Bearer $TOK")
              local OK=0 FAIL=0 BYTES=0
              local IDX="" TRY
              for TRY in 1 2; do
                IDX=$(curl -fsS -m "$TMO" "${HDRS[@]}" -H "Accept: $IDX_ACCEPT" "https://$REG/v2/$REPO/manifests/$VERSION" 2>/dev/null || true)
                [ -n "$IDX" ] && break
                [ "$TRY" = 1 ] && { echo "  [$REG] $REPO manifest 冷缓存/抖动，15s 后单次复查"; sleep 15; }
              done
              if [ -z "$IDX" ]; then echo "  [$REG] ❌ $REPO manifest 不可达"; TOFAIL=$((TOFAIL+1)); continue; fi
              local MDIG
              MDIG=$(printf '%s' "$IDX" | python3 -c 'import json,sys
          i=json.load(sys.stdin);ms=i.get("manifests") or []
          hit=[m for m in ms if (m.get("platform") or {}).get("architecture")==sys.argv[1] and (m.get("platform") or {}).get("os")=="linux"]
          print(hit[0]["digest"] if hit else "")' "$OCI_ARCH" 2>/dev/null || true)
              if [ -z "$MDIG" ]; then echo "  [$REG] ❌ $REPO index 中无 $OCI_ARCH/linux 平台条目（异常形态，跳过勿瞎猜）"; TOFAIL=$((TOFAIL+1)); continue; fi
              local MAN
              MAN=$(curl -fsS -m "$TMO" "${HDRS[@]}" -H "Accept: $MAN_ACCEPT" "https://$REG/v2/$REPO/manifests/$MDIG" 2>/dev/null || true)
              if [ -z "$MAN" ]; then echo "  [$REG] ❌ $REPO 平台 manifest($MDIG) 不可达"; TOFAIL=$((TOFAIL+1)); continue; fi
              local BLOBS
              BLOBS=$(printf '%s' "$MAN" | python3 -c 'import json,sys;m=json.load(sys.stdin);print(m["config"]["digest"]);[print(l["digest"]) for l in m.get("layers",[])]' 2>/dev/null || true)
              if [ -z "$BLOBS" ]; then echo "  [$REG] ❌ $REPO manifest 解析失败/无 blobs"; TOFAIL=$((TOFAIL+1)); continue; fi
              local R CODE SZ B
              for B in $BLOBS; do
                R=$(curl -s -o /dev/null -m 600 "${HDRS[@]}" -H "Accept: application/vnd.oci.image.layer.v1.tar+gzip" -w "%{http_code} %{size_download}" -L "https://$REG/v2/$REPO/blobs/$B" || echo "000 0")
                CODE="${R% *}"; SZ="${R#* }"
                if [ "$CODE" = "200" ]; then OK=$((OK+1)); BYTES=$((BYTES+SZ)); else FAIL=$((FAIL+1)); echo "  [$REG] ⚠️ blob ${B:0:19} HTTP $CODE"; fi
              done
              echo "  [$REG] $REPO:$VERSION 预热完成 (ok=$OK fail=$FAIL $((BYTES/1024/1024))MB)"
              TOTOK=$((TOTOK+OK)); TOFAIL=$((TOFAIL+FAIL))
            done
            echo "  [$REG] 汇总 ok=$TOTOK fail=$TOFAIL"
            [ "$TOFAIL" -eq 0 ]
          }
          # 1ms：冷 tag 边缘 404 属闪断形态，短重试无效——单轮失败则 300s 后
          # 一次性复查（给边缘同步留时间），仍失败才告警。
          warm_via ghcr.1ms.run "https://ghcr.1ms.run/openapi/v1/auth/token" ghcr.1ms.run 60 \
            || { echo "  1ms 首轮未全绿，300s 后复查一次…"; sleep 300; \
                 warm_via ghcr.1ms.run "https://ghcr.1ms.run/openapi/v1/auth/token" ghcr.1ms.run 60 \
                 || echo "::warning title=1ms.run 预热未全绿::边缘缓存仍冷（多边缘 200/404 闪断属常态），客户首装或回源慢；处理见加载项 README FAQ"; }
          warm_via ghcr.nju.edu.cn "" "" 180 \
            || echo "::warning title=nju 备用源预热未全绿::仅影响手动换源场景，不阻塞发布"

  # ========== 3. 创建 GitHub Release ==========
  release:
    name: Release
    needs: [prepare, manifest]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== 5. 真栈 E2E（真 HA + 真 mosquitto，第七轮评分补"mock≠真"债） ==========
  # v1.6.23 定案：本地真栈 9 轮 + CI 真栈连绿两轮（b228ce5/dff0efa）后摘除
  # continue-on-error 升为发布硬门禁——e2e 前移与 build 并行（测试对象是
  # 源码 bind 挂载 + :stable HA，不依赖本仓库镜像），并作为 manifest 前置：
  # E2E 失败 = 不合并 manifest = 版本 tag/latest 均不晋升。
  e2e:
    name: E2E real stack
    needs: [prepare]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run real-stack E2E
        run: bash huijian_mqtt_broker/tests/e2e/run_e2e.sh

  # ========== 6. Gitee Release 自动补发（2026-10-06 复活，接管此前每次手工 POST） ==========
  # 历史三段：v1.7.24 按"只推 GitHub"裁定整段移除 → 2026-09-17 该裁定被推翻
  # （停推代价实证＝已配 Gitee 源的 HA 实例商店 latest 永久停在 1.7.24、升级提示
  # 静默失效，见 CLAUDE.md 推送与验证流程）→ 但 job 没跟着回来，改成发版时手工
  # POST，v1.7.63/64/65 三条 Gitee Release 全是手工建的（漏一条＝徽章偏旧且无人知）。
  # 本次语音侧并入商店仓时把它一并自动化，判据沿用语音侧那条 job 攒下的实得教训：
  #   · body 取 CHANGELOG 对应版本段，缺段回落 prepare 产物（不再 ValueError 崩 job）
  #   · target_commitish 必带（API 缺省行为不可靠）
  #   · 幂等且**正文自愈**：同 tag 已存在则 PATCH 同步最新正文——PUT 必 405，且
  #     PATCH 必须同载 tag_name+name（只发 body 直接 400 "tag_name is missing"）
  #   · token 必须是纯 ASCII：.gitee_token 曾带 UTF-8 BOM，混进来会 401 长得像过期
  #   · **先等 Gitee 侧真有本次 sha 再建 Release**：双推里 gitee push 排在 CI 之后，
  #     sha 不在 Gitee 时 target_commitish 会被解成镜像仓的旧提交＝Release 静默指错
  #     版本。等不到就响亮失败（并提示"先 git push gitee main"），不静默将就。
  gitee-release:
    name: Gitee Release
    needs: [prepare, release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ github.repository }}   # gitee 侧同名仓（双远端规矩）
      COMMIT: ${{ github.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PREPARED: ${{ needs.prepare.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for this commit to exist on the Gitee mirror
        run: |
          set -eu
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error title=GITEE_TOKEN 未配置::仓库 Settings→Secrets→Actions 添加 GITEE_TOKEN（纯 ASCII，勿带 BOM）"
            exit 1
          fi
          case "$GITEE_TOKEN" in
            *[![:print:]]*|$'\xef'*) echo "::error title=GITEE_TOKEN 含异常字节::疑似复制进 BOM/换行，重新设置纯 token"; exit 1;;
          esac
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 \
                   "https://gitee.com/api/v5/repos/${GITEE_REPO}/commits/${COMMIT}?access_token=${GITEE_TOKEN}" \
                   || echo 000)
            if [ "$code" = "200" ]; then echo "Gitee 已有 ${COMMIT:0:8}（第 $i 次探测）"; exit 0; fi
            sleep 20
          done
          echo "::error title=Gitee 镜像仓 10 分钟内没有本次提交::target_commitish 会指到旧提交，故拒绝建 Release。请先 git push gitee main（与 tag 一并双推）后重跑本 job。"
          exit 1

      - name: Create or sync Gitee Release (idempotent)
        run: |
          set -eu
          python3 - <<'PY'
          import io, json, os, sys, urllib.error, urllib.request
          ver, sha = os.environ["VERSION"], os.environ["COMMIT"]
          tok = os.environ["GITEE_TOKEN"].strip()
          if not tok.isascii():
              print("::error title=GITEE_TOKEN 非 ASCII::含 BOM 或不可见字符"); sys.exit(1)
          api = "https://gitee.com/api/v5/repos/" + os.environ["GITEE_REPO"]
          tag = "v" + ver

          def call(url, data=None, method=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode() if data else None,
                  method=method or ("POST" if data else "GET"),
                  headers={"Content-Type": "application/json"} if data else {})
              return json.load(urllib.request.urlopen(req, timeout=30))

          body = ""
          if os.path.exists("CHANGELOG.md"):
              log = io.open("CHANGELOG.md", encoding="utf-8").read()
              # 只在网关半区里找：语音并入块以下有 13 个重号（1.0.x/1.1.x），不切边界时
              # 「网关历史版本重发」会取到语音正文（与语音侧那三处同一形状，反向对称）。
              _blk = "# 慧尖HA语音插件 变更日志"
              if _blk in log:
                  log = log[:log.index(_blk)]
              if "## [%s]" % ver in log:
                  i = log.index("## [%s]" % ver)
                  rest = log[i + 1:]
                  j = rest.index("## [", 3) if "## [" in rest[3:] else len(rest)
                  body = log[i:i + 1 + j].strip()
          if not body:
              body = (os.environ.get("PREPARED") or "").strip()
              if not body:
                  body = "## v%s\n\n完整变更记录见 GitHub Release %s。" % (ver, tag)
          body = body + "\n\n---\n完整记录见 GitHub 仓库 CHANGELOG.md 与 Release %s。" % tag

          try:
              existing = call("%s/releases/tags/%s?access_token=%s" % (api, tag, tok))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              existing = None
          if existing and existing.get("id"):
              r = call("%s/releases/%s?access_token=%s" % (api, existing["id"], tok),
                       {"body": body, "tag_name": tag, "name": tag}, method="PATCH")
              print("Gitee Release 已同步正文: id=%s tag=%s" % (r.get("id", existing["id"]), tag))
              sys.exit(0)
          r = call("%s/releases?access_token=%s" % (api, tok), {
              "tag_name": tag, "name": tag, "body": body,
              "target_commitish": sha, "prerelease": False})
          print("Gitee Release 已创建: id=%s tag=%s" % (r["id"], r["tag_name"]))
          PY
